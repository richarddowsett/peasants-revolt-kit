name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd app
          npm ci

      - name: Build Next.js Static Export
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: peasants-running-kit.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: peasants-running-kit
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: peasants-running-kit.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "98587359280"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:98587359280:web:8e3063a02fc4408c2f15f5"
        run: |
          cd app
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.GCP_SA_KEY }}'
          channelId: live
          projectId: peasants-running-kit
          entryPoint: ./app
