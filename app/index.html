<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peasants Running Kit | Peasants Revolt Running Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Official club running top color: RGB 202, 88, 46 */
      --brand-color: rgb(202, 88, 46);
      --brand-dark: rgb(170, 70, 34);
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --bg-card: rgba(255, 255, 255, 0.96);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--brand-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      color: #ffffff;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(0, 0, 0, 0.15) 0%, transparent 45%);
    }

    main {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: var(--bg-card);
      color: var(--text-dark);
      border-radius: 24px;
      padding: 2.75rem 2rem;
      text-align: center;
      box-shadow: 
        0 20px 25px -5px rgba(0, 0, 0, 0.2),
        0 8px 10px -6px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(12px);
    }

    .logo-wrapper {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: #ffffff;
      padding: 6px;
      box-shadow: 0 10px 20px rgba(202, 88, 46, 0.2);
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: rgba(202, 88, 46, 0.1);
      color: var(--brand-color);
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: var(--brand-color);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(202, 88, 46, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 8px rgba(202, 88, 46, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(202, 88, 46, 0);
      }
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #0f172a;
      margin-bottom: 0.4rem;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1rem;
      font-weight: 700;
      color: var(--brand-color);
      margin-bottom: 1.25rem;
    }

    .description {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="logo-wrapper">
        <img src="logo.png" alt="Peasants Revolt Running Club Logo">
      </div>

      <div class="badge">
        <span class="badge-dot"></span>
        Store Coming Soon
      </div>

      <h1>Peasants Running Kit</h1>
      <p class="subtitle">Peasants Revolt Running Club</p>

      <p class="description">
        We are preparing our official club store! Soon you'll be able to order running tops, kit, and gear right here.
      </p>
    </div>
  </main>

  <footer>
    <p>&copy; Peasants Revolt Running Club</p>
  </footer>
</body>
</html>
